          - paragraph [ref=e1254]:
            - img [ref=e1255]
          - heading "What is PySimpleGUI?" [level=1] [ref=e1256]
          - paragraph [ref=e1257]: PySimpleGUI is a wrapper for tkinter (and other GUI libraries) that transforms the GUI SDK into a simpler, more compact architecture while still providing detailed customization. No prior GUI programming experience needed.
          - paragraph [ref=e1258]: This is an entire interactive application.
          - generic [ref=e1260]:
            - button "Copy to clipboard" [ref=e1261] [cursor=pointer]
            - code [ref=e1262]: "import PySimpleGUI as sg # Define the window's contents layout = [[sg.Text(\"What's your name?\")], [sg.Input(key='-INPUT-')], [sg.Text(size=(40,1), key='-OUTPUT-')], [sg.Button('Ok'), sg.Button('Quit')]] # Create the window window = sg.Window('Window Title', layout) # Display and interact with the Window using an Event Loop while True: event, values = window.read() # See if user wants to quit or window was closed if event == sg.WINDOW_CLOSED or event == 'Quit': break # Output a message to the window window['-OUTPUT-'].update('Hello ' + values['-INPUT-'] + \"! Thanks for trying PySimpleGUI\") # Finish up by removing from the screen window.close()"
          - paragraph [ref=e1263]: This is the window that's created.
          - paragraph [ref=e1264]:
            - img "win1"
          - paragraph [ref=e1265]: Here's the same window after some user interaction.
          - paragraph [ref=e1266]:
            - img "win2"
          - heading "Open Source Once Again..." [level=1] [ref=e1267]
          - paragraph [ref=e1268]: Hey, it's Mike....
          - paragraph [ref=e1269]:
            - text: We gave commercialization a try. It was an incredible experience, but it didn’t generate the resources needed to sustain PySimpleGUI at the level we had hoped. To learn more about the history of the PySimpleGUI project, check out the
            - link "History Tab" [ref=e1270] [cursor=pointer]:
              - /url: https://docs.pysimplegui.com/history/
            - text: . In February 2025, we announced that PySimpleSoft would be shutting down, with support continuing through the end of 2025.
          - paragraph [ref=e1271]: That process is now complete. The next question was what to do with the code, documentation, and repositories. I always planned to keep the repos available for reference—so the decision came down to the software itself.
          - heading "PySimpleGUI 6" [level=1] [ref=e1272]
          - paragraph [ref=e1273]:
            - img
          - paragraph [ref=e1274]: I’ve released the PySimpleGUI 5 code as open source. After removing licensing and security components, it’s now available under the LGPL3 license on GitHub and PyPI.
          - heading "Installing from PyPI" [level=2] [ref=e1275]
          - paragraph [ref=e1276]: "To install the latest version (v6):"
          - paragraph [ref=e1277]:
            - code [ref=e1278]: python -m pip install PySimpleGUI
          - paragraph [ref=e1279]: "If you need the older version (4.60.5.1):"
          - paragraph [ref=e1280]:
            - code [ref=e1281]: python -m pip install PySimpleGUI==4.60.5.1
          - heading "Installing from Github" [level=2] [ref=e1282]
          - paragraph [ref=e1283]: "The GitHub repo has the most up-to-date code. You can install directly without cloning:"
          - paragraph [ref=e1284]:
            - code [ref=e1285]: python -m pip install --upgrade https://github.com/PySimpleGUI/PySimpleGUI/zipball/master
          - paragraph [ref=e1286]: "Or clone/download the repo and install locally:"
          - paragraph [ref=e1287]:
            - code [ref=e1288]: python -m pip install .
          - heading "Longer Term Outlook" [level=2] [ref=e1289]
          - paragraph [ref=e1290]: I’m still wrapping up the transition from version 5 to 6, including the docs. After that, I’m honestly not sure what the long-term future looks like—but if the past 8 years are any indication, I’m not great at predicting it.
          - paragraph [ref=e1291]: For now, I’m here and happy to help.
          - heading "Thank you" [level=2] [ref=e1292]
          - paragraph [ref=e1293]: PySimpleGUI has been a once-in-a-lifetime experience. It’s been amazing to see what people have built and to be a small part of it. Thanks to everyone who supported the project over the years.
