                - generic [ref=e687]:
                  - heading "Introduction" [level=2] [ref=e688]
                  - 'link "Permalink: Introduction" [ref=e689] [cursor=pointer]':
                    - /url: "#introduction"
                    - img [ref=e690]
                - paragraph [ref=e692]: Tauri is a framework for building tiny, blazingly fast binaries for all major desktop platforms. Developers can integrate any front-end framework that compiles to HTML, JS and CSS for building their user interface. The backend of the application is a rust-sourced binary with an API that the front-end can interact with.
                - paragraph [ref=e693]:
                  - text: The user interface in Tauri apps currently leverages
